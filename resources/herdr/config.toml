onboarding = false

[theme]
name = "one-dark"
auto_switch = false

[terminal]
new_cwd = "follow"

[keys]
next_tab = ["prefix+n", "ctrl+tab"]
previous_tab = ["prefix+p", "ctrl+shift+tab"]
next_agent = "prefix+period"
previous_agent = "prefix+comma"
focus_agent = "prefix+alt+1..9"

[[keys.command]]
key = "prefix+alt+g"
type = "popup"
command = "lazygit"
width = "85%"
height = "85%"

[ui]
confirm_close = true
copy_on_select = true
agent_panel_sort = "priority"
status_indicators = "symbols"
show_agent_labels_on_pane_borders = true

[ui.toast]
delivery = "system"
